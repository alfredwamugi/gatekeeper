version: "3.8"

services:
  gatekeeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: gatekeeper:latest
    container_name: gatekeeper-edge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GATEKEEPER_DEVICE_ID=${GATEKEEPER_DEVICE_ID:-edge-mini-pc-01}
      - FLEET_MANAGEMENT_URL=${FLEET_MANAGEMENT_URL:-https://fleet.tektally.com}
      - HEALTH_PORT=8080
    volumes:
      - ./data:/app/data
    devices:
      # Optional: Uncomment if passing through Intel/NVIDIA GPU acceleration for YOLO inference
      # - /dev/dri:/dev/dri
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 2g
    cpus: "1.50"
    pids_limit: 256
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2g
        reservations:
          cpus: "0.50"
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
